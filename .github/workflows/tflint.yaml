name: tf-lint

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  tflint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        name: Checkout

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef #v6.3.1
        name: Setup TFLint
        # with:
        #   tflint_version: v0.55.0

      - name: Show version
        run: tflint --version

      - name: Init TFLint
        run: tflint --init --config=${{ github.workspace }}/automation/.tflint.hcl

      - name: Run TFLint
        run: tflint --chdir=./terraform --config=${{ github.workspace }}/automation/.tflint.hcl -f compact
