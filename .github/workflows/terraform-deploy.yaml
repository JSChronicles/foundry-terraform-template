name: terraform deploy
on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: terraform-deploy-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: terraform

jobs:
  terraform-deploy:
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == 'main' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_version: 1.15.2

      - name: Auth into AWS
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Find validation run ID
        id: find-run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            })
            const prHeadSha = prs[0]?.head?.sha

            if (!prHeadSha) {
              core.setFailed(`No PR found for commit ${context.sha}`)
              return
            }

            const { data: { workflow_runs } } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'terraform-validation.yaml',
              head_sha: prHeadSha,
              status: 'success',
              per_page: 1
            })

            const runId = workflow_runs[0]?.id
            if (!runId) {
              core.setFailed(`No successful terraform-validation run found for SHA ${prHeadSha}`)
              return
            }
            return runId

      - name: Download Terraform plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: tfplan
          path: terraform
          run-id: ${{ steps.find-run.outputs.result }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Init
        run: terraform init -reconfigure -no-color

      - name: Terraform Apply (approved plan)
        run: terraform apply -input=false tfplan

